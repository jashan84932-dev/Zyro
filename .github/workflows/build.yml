name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-read-only: false
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zyro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
